name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble release APK
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/eb3a-widget.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: eb3a-widget-apk
          path: dist/eb3a-widget.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: EB3A Ватты (latest)
          body: |
            Автосборка с ветки `${{ github.ref_name }}`.
            Коммит: `${{ github.sha }}`
          files: dist/eb3a-widget.apk
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
